<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compito fine modulo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
    <h1>algoritmo di ricerca</h1>
    <p class="subtitle">per cercare compila i campi qui sotto</p>
    <div class="search-container">
        <div class="input-grup">
            <label for="titleInput">Titolo lavorativo:</label>
            <input type="text" id="titleInput" placeholder="es. marketing">
        </div>
        <div class="input-group">
            <label for="locationInput">Location:</label>
            <input type="text" id="locationInput" placeholder="es. us">
        </div>
    </div>
    <button id="searchBtn">Cerca</button>
    <h3 class="counter-box">
        Risultati trovati: <span id="countDisplay">0</span>
    </h3>
    <ul id="resultList"></ul>
    </div>
    <script src="scaricabile.js"></script>
</body>
</html>
